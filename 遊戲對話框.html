<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>像素對話框生成器 | 進階豪華版</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome@4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#A89078',
            secondary: '#F5F1ED',
            neutral: '#5C544C',
          },
          fontFamily: {
            sans: ['"Noto Sans TC"', 'system-ui', 'sans-serif'],
          },
        },
      }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .pixel-border {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
      }
      .btn-primary {
        @apply px-8 py-2.5 rounded-full border border-primary text-primary bg-white hover:bg-primary/5 transition-all duration-300 disabled:border-gray-300 disabled:text-gray-300 disabled:bg-gray-50 disabled:cursor-not-allowed;
      }
      .control-label {
        @apply text-sm text-neutral/80 font-medium mb-1;
      }
      .opacity-preview {
        @apply w-8 h-8 rounded-sm ml-2 flex items-center justify-center;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        border-width: 2px;
        border-style: solid;
      }
      .style-card {
        @apply border-2 rounded-md p-2 text-center cursor-pointer transition-all bg-white text-xs;
      }
      .style-card.active {
        @apply border-primary bg-primary/10;
      }
      .style-group-title {
        @apply text-xs font-semibold text-neutral/70 mt-3 mb-2 border-l-4 border-primary pl-2;
      }
      .no-resize {
        resize: none;
      }
      textarea::-webkit-scrollbar { display: none; }
      textarea { -ms-overflow-style: none; scrollbar-width: none; }
    }
  </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col overflow-x-hidden font-sans">
  <main class="flex-1 flex flex-col p-4 md:p-6 max-w-5xl mx-auto w-full">
    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm mb-4">
      <div id="emptyPreviewHint" class="text-center py-12 text-neutral/60">
        <i class="fa fa-image text-4xl mb-3 text-neutral/30"></i><br>
        點擊上傳背景圖片
      </div>
      <div id="previewContainer" class="hidden mx-auto">
        <canvas id="previewCanvas" class="pixel-border rounded mx-auto"></canvas>
      </div>
    </div>

    <div class="w-full flex justify-center mb-4">
      <button id="downloadBtn" class="btn-primary font-medium" disabled>
        下載圖片
      </button>
    </div>

    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="control-label block">對話文字</label>
          <textarea id="dialogueText" rows="2" class="w-full p-2 border border-gray-200 rounded-md no-resize" placeholder="輸入對話內容...">風吹過街巷 溫柔藏日常 美好一直在身旁</textarea>
        </div>
        <div>
          <label class="control-label block">上傳背景圖</label>
          <input type="file" id="imageUpload" accept="image/*" class="w-full p-2 border border-gray-200 rounded-md">
        </div>
      </div>
    </div>

    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="md:col-span-2 lg:col-span-3">
          <div id="styleWrap">
            <div class="style-group-title">經典</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3" data-group="classic"></div>
            <div class="style-group-title">特調</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3" data-group="new"></div>
            <div class="style-group-title">透明</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3" data-group="transparent"></div>
            <div class="style-group-title">賽博</div>
            <div class="grid grid-cols-3 sm:grid-cols-5 gap-2" data-group="cyber"></div>
          </div>
        </div>
        <div>
          <label class="control-label block">文字顏色</label>
          <input type="color" id="textColor" value="#000000" class="w-full h-10 border-0 rounded-md cursor-pointer">
        </div>
        <div>
          <label class="control-label block">對話框透明度</label>
          <div class="flex items-center gap-2">
            <input type="range" id="boxOpacity" min="0.1" max="1" step="0.1" value="1" class="w-full accent-primary">
            <span id="boxOpacityVal" class="text-xs text-neutral/60 w-10">100%</span>
            <div id="opacityPreview" class="opacity-preview"></div>
          </div>
        </div>
        <div>
          <label class="control-label block">文字大小 (%)</label>
          <div class="flex items-center gap-2">
            <input type="range" id="textSizeSlider" min="50" max="150" step="10" value="90" class="w-full accent-primary">
            <span id="textSizeVal" class="text-xs text-neutral/60 w-12">90%</span>
          </div>
        </div>
        <div>
          <label class="control-label block">底部留白距離 (%)</label>
          <input type="range" id="bottomMarginSlider" min="0" max="15" step="0.5" value="4" class="w-full accent-primary">
          <span id="bottomMarginVal" class="text-xs text-neutral/60">4%</span>
        </div>
        <div>
          <label class="control-label block">位置微調</label>
          <div class="flex gap-1">
            <button id="moveUp" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-up"></i></button>
            <button id="moveDown" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-down"></i></button>
            <button id="moveLeft" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-left"></i></button>
            <button id="moveRight" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-right"></i></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 px-6 text-center text-sm text-neutral/50 border-t border-gray-100 mt-6">
    簡約像素對話框生成器 © 2026
  </footer>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    let backgroundImage = null;
    let boxOffsetX = 0, boxOffsetY = 0;
    let currentStyle = 'style1';
    const baseFontSize = 24;
    const baseTextPadding = 40;
    const baseLineHeight = 1.8;
    const baseLetterSpacing = 4;
    const baseMinBoxHeight = 120;
    const baseBorderWidth = 6;
    let textSizeScale = 0.9;

    const MIN_FONT_SIZE = 16;
    const MIN_BOX_PADDING = 30;
    const BOX_WIDTH_RATIO = 0.9;

    const styleGroups = {
      classic: [{key:'style1',name:'純紫'},{key:'style2',name:'藍'},{key:'style3',name:'紫'},{key:'style12',name:'粉'},{key:'style14',name:'白雲天空'},{key:'style15',name:'純粉'},{key:'mora1',name:'莫蘭迪咖'},{key:'mora2',name:'莫蘭迪灰'},{key:'maca1',name:'淺粉'},{key:'maca2',name:'薄荷'},{key:'game1',name:'黑白'}],
      cyber: [{key:'castle1',name:'白電光'}],
      new: [{key:'new1',name:'三層白'},{key:'new3',name:'浪漫'},{key:'new7',name:'信紙咖'},{key:'new8',name:'甜蜜'},{key:'new11',name:'漫畫尖角'},{key:'new12',name:'藍波雲'},{key:'sum1',name:'夏日清涼'},{key:'pea1',name:'水蜜桃'},{key:'school1',name:'信紙藍'}],
      transparent: [{key:'ani1',name:'白透'},{key:'ani2',name:'磨砂'}]
    };

    const stylePreviewMap = {
      style1: { bg: '#FFDFFF', border: '#A855F7', isDark: false },
      style2: { bg: '#FFFFFF', border: '#0EA5E9', isDark: false },
      style3: { bg: '#FFFFFF', border: '#9333EA', isDark: false },
      style12: { bg: '#FFFFFF', border: '#FF69B4', isDark: false },
      style14: { bg: '#87CEFA', border: '#FFFFFF', isDark: false },
      style15: { bg: '#FFB6C1', border: '#FF1493', isDark: false },
      game1: { bg: '#111111', border: '#EEEEEE', isDark: true },
      maca1: { bg: '#FFEEF4', border: '#F8BBD0', isDark: false },
      maca2: { bg: '#E8F8F5', border: '#80CBC4', isDark: false },
      mora1: { bg: '#EAE2E2', border: '#BFA8A8', isDark: false },
      mora2: { bg: '#E2E8F0', border: '#94A3B8', isDark: false },
      ani1: { bg: 'rgba(255,255,255,0.88)', border: '#D1D5DB', isDark: false },
      ani2: { bg: 'rgba(255,255,250,0.92)', border: 'rgba(200,200,200,0.7)', isDark: false },
      new1: { bg: '#121212', border: '#E5E5E5', isDark: true },
      new3: { bg: '#FFEEF6', border: '#FFB7C5', isDark: false },
      new7: { bg: '#F5EFE2', border: '#A89078', isDark: false },
      new8: { bg: '#FFEEF2', border: '#F472B6', isDark: false },
      new11: { bg: '#FFFFFF', border: '#64748B', isDark: false },
      new12: { bg: '#E0F7FA', border: '#4DD0E1', isDark: false },
      sum1: { bg: '#E6FFFA', border: '#22D3EE', isDark: false },
      pea1: { bg: '#FFECEC', border: '#FDA4AF', isDark: false },
      school1: { bg: '#EFF6FF', border: '#60A5FA', isDark: false },
      castle1: { bg: '#1E293B', border: '#CBD5E1', isDark: true }
    };

    window.addEventListener('load', () => {
      initCanvasRendering();
      loadDefaultBackground();
      buildGroupStyleCards();
      bindAllEvents();
      updateOpacityPreview();
      updateTextColorByStyle();
      updateTextSizeDisplay();
      highlightStyleCard();
    });

    function buildGroupStyleCards(){
      Object.keys(styleGroups).forEach(groupKey=>{
        const items = styleGroups[groupKey];
        const wrap = document.querySelector(`[data-group="${groupKey}"]`);
        items.forEach(item=>{
          const card = document.createElement('div');
          card.className = 'style-card';
          card.dataset.style = item.key;
          card.innerText = item.name;
          card.addEventListener('click',()=>{
            currentStyle = item.key;
            highlightStyleCard();
            updateOpacityPreview();
            updateTextColorByStyle();
            redrawCanvas();
          });
          wrap.appendChild(card);
        });
      });
    }
    function highlightStyleCard(){
      document.querySelectorAll('.style-card').forEach(card=>card.classList.toggle('active', card.dataset.style === currentStyle));
    }
    function initCanvasRendering() {
      ctx.imageSmoothingEnabled = false;
      ctx.mozImageSmoothingEnabled = false;
      ctx.webkitImageSmoothingEnabled = false;
      ctx.msImageSmoothingEnabled = false;
    }
    function loadDefaultBackground() {
      const defaultImg = new Image();
      defaultImg.crossOrigin = 'Anonymous';
      defaultImg.src = 'https://picsum.photos/seed/morandi-light/1000/600';
      defaultImg.onload = () => {
        backgroundImage = defaultImg;
        setupCanvas();
      };
    }
    function setupCanvas() {
      const dpr = window.devicePixelRatio || 1;
      const maxW = Math.min(backgroundImage.width, window.innerWidth - 32);
      const scale = maxW / backgroundImage.width;
      canvas.width = backgroundImage.width * dpr;
      canvas.height = backgroundImage.height * dpr;
      canvas.style.width = maxW + 'px';
      canvas.style.height = (backgroundImage.height * scale) + 'px';
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      redrawCanvas();
      document.getElementById('emptyPreviewHint').classList.add('hidden');
      document.getElementById('previewContainer').classList.remove('hidden');
      document.getElementById('downloadBtn').disabled = false;
    }
    function drawDotPattern(x,y,w,h,scale){
      const dotSize = Math.max(2, 4 * scale);
      ctx.fillStyle = 'rgba(0,0,0,0.08)';
      for(let px=x; px<x+w; px+=dotSize*2) for(let py=y; py<y+h; py+=dotSize*2) ctx.fillRect(px,py,dotSize,dotSize);
    }
    function drawLinePattern(x,y,w,h,scale){
      const gap = Math.max(6, 12 * scale);
      ctx.fillStyle = 'rgba(0,0,0,0.05)';
      for(let py=y; py<y+h; py+=gap) ctx.fillRect(x, py, w, Math.max(1,2*scale));
    }
    function drawGlowStroke(x,y,w,h,color,borderW){
      ctx.shadowColor = color;
      ctx.shadowBlur = borderW * 2.5;
      ctx.strokeStyle = color;
      ctx.lineWidth = borderW;
      ctx.strokeRect(x,y,w,h);
      ctx.shadowBlur = 0;
    }
    function drawPixelPeach(x, y, w, h, scale){
      const peachCount = Math.floor((w * h) / (8000 / scale));
      const peachSize = Math.max(4, Math.round(8 * scale));
      for (let i = 0; i < peachCount; i++) {
        const peachX = x + Math.random() * (w - peachSize);
        const peachY = y + Math.random() * (h - peachSize);
        ctx.fillStyle = '#FDA4AF';
        ctx.fillRect(peachX, peachY, peachSize, peachSize);
        ctx.fillStyle = '#86EFAC';
        ctx.fillRect(peachX + peachSize * 0.3, peachY - peachSize * 0.2, peachSize * 0.4, peachSize * 0.2);
      }
    }

    function redrawCanvas() {
      if (!backgroundImage) return;
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0, 0, canvas.width / dpr, canvas.height / dpr);
      ctx.drawImage(backgroundImage, 0, 0, canvas.width / dpr, canvas.height / dpr);
      const imgW = canvas.width / dpr;
      const imgH = canvas.height / dpr;
      const scaleBase = imgW / 1000;
      const fontSize = Math.max(MIN_FONT_SIZE, baseFontSize * scaleBase * textSizeScale);
      const padding = Math.max(MIN_BOX_PADDING, baseTextPadding * scaleBase);
      const lineHeight = baseLineHeight * fontSize;
      const letterSpacing = baseLetterSpacing * scaleBase;
      const minH = Math.max(baseMinBoxHeight * scaleBase, fontSize * 1.5);
      const borderW = Math.max(2, Math.round(baseBorderWidth * scaleBase));
      const offsetX = (boxOffsetX / 100) * imgW;
      const offsetY = (boxOffsetY / 100) * imgH;
      drawScaledDialogueBox(imgW, imgH, scaleBase, fontSize, padding, lineHeight, letterSpacing, minH, borderW, offsetX, offsetY);
    }

    function drawScaledDialogueBox(imgW, imgH, scale, fontSize, padding, lineHeight, letterSpacing, minH, borderW, offsetX, offsetY) {
      const style = currentStyle;
      const text = document.getElementById('dialogueText').value.trim();
      const textColor = document.getElementById('textColor').value;
      const opacity = parseFloat(document.getElementById('boxOpacity').value);
      const marginPerc = parseFloat(document.getElementById('bottomMarginSlider').value);
      const marginBottom = (marginPerc / 100) * imgH;

      ctx.font = `${fontSize}px "Noto Sans TC", sans-serif`;
      ctx.textBaseline = 'top'; // 固定顶部基线，彻底消除基线偏差

      const boxW = imgW * BOX_WIDTH_RATIO;
      const textMaxWidth = boxW - padding * 2;
      // 文本分行
      const lines = [];
      let currentLine = '';
      let currentLineWidth = 0;
      const chars = text.split('');
      for (let j = 0; j < chars.length; j++) {
        const char = chars[j];
        const charW = ctx.measureText(char).width;
        const addW = currentLineWidth === 0 ? charW : charW + letterSpacing;
        if (currentLineWidth + addW <= textMaxWidth) {
          currentLine += char;
          currentLineWidth += addW;
        } else {
          lines.push(currentLine);
          currentLine = char;
          currentLineWidth = charW;
        }
      }
      if (currentLine) lines.push(currentLine);

      const totalTextHeight = lines.length * lineHeight;
      const boxH = Math.max(minH, totalTextHeight + padding * 2);
      const boxX = (imgW - boxW) / 2 + offsetX;
      let boxY = imgH - boxH - marginBottom - offsetY;
      if (boxY < 20) boxY = 20;

      ctx.save();
      ctx.globalAlpha = opacity;
      // 绘制对话框样式
      switch (style) {
        case 'style14':
          let skyGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY+boxH);
          skyGrad.addColorStop(0,'#87CEFA'); skyGrad.addColorStop(1,'#E0F7FF');
          ctx.fillStyle = skyGrad;
          const radius = borderW * 3;
          ctx.beginPath();
          ctx.moveTo(boxX + radius, boxY);
          ctx.lineTo(boxX + boxW - radius, boxY);
          ctx.quadraticCurveTo(boxX + boxW, boxY, boxX + boxW, boxY + radius);
          ctx.lineTo(boxX + boxW, boxY + boxH - radius);
          ctx.quadraticCurveTo(boxX + boxW, boxY + boxH, boxX + boxW - radius, boxY + boxH);
          ctx.lineTo(boxX + radius, boxY + boxH);
          ctx.quadraticCurveTo(boxX, boxY + boxH, boxX, boxY + boxH - radius);
          ctx.lineTo(boxX, boxY + radius);
          ctx.quadraticCurveTo(boxX, boxY, boxX + radius, boxY);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#ffffff'; ctx.lineWidth = borderW * 1.2; ctx.stroke();
          break;
        case 'ani2':
          ctx.fillStyle = stylePreviewMap[style].bg;
          ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*4); ctx.fill();
          ctx.strokeStyle = stylePreviewMap[style].border; ctx.lineWidth = borderW; ctx.stroke();
          break;
        case 'new1':
          ctx.fillStyle = '#121212'; ctx.fillRect(boxX,boxY,boxW,boxH);
          ctx.strokeStyle = '#E5E5E5'; ctx.lineWidth = borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
          ctx.strokeStyle = '#BBBBBB'; ctx.lineWidth = borderW*0.5; ctx.strokeRect(boxX+borderW,boxY+borderW,boxW-borderW*2,boxH-borderW*2);
          ctx.strokeStyle = '#888888'; ctx.lineWidth = borderW*0.25; ctx.strokeRect(boxX+borderW*2,boxY+borderW*2,boxW-borderW*4,boxH-borderW*4);
          break;
        case 'new3':
          ctx.fillStyle = '#FFEEF6'; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*2); ctx.fill();
          ctx.strokeStyle = '#FFC8D8'; ctx.lineWidth = borderW; ctx.stroke();
          ctx.strokeStyle = '#FFB7C5'; ctx.lineWidth = borderW*0.5; ctx.strokeRect(boxX+borderW,boxY+borderW,boxW-borderW*2,boxH-borderW*2);
          break;
        case 'new7':
          ctx.fillStyle = '#F5EFE2'; ctx.fillRect(boxX,boxY,boxW,boxH);
          drawLinePattern(boxX,boxY,boxW,boxH,scale);
          ctx.strokeStyle = '#A89078'; ctx.lineWidth = borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
          break;
        case 'new8':
          ctx.fillStyle = '#FFEEF2'; ctx.fillRect(boxX,boxY,boxW,boxH);
          drawDotPattern(boxX,boxY,boxW,boxH,scale);
          ctx.strokeStyle = '#F472B6'; ctx.lineWidth = borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
          break;
        case 'new11':
          ctx.fillStyle = '#FFFFFF';
          ctx.beginPath();
          ctx.moveTo(boxX+borderW*3, boxY);
          ctx.lineTo(boxX+boxW-borderW*3, boxY);
          ctx.lineTo(boxX+boxW, boxY+boxH/2);
          ctx.lineTo(boxX+boxW-borderW*3, boxY+boxH);
          ctx.lineTo(boxX+borderW*3, boxY+boxH);
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#64748B'; ctx.lineWidth = borderW; ctx.stroke();
          break;
        case 'new12':
          ctx.fillStyle = '#E0F7FA';
          ctx.beginPath();
          const waveW = borderW * 2.5;
          let currX = boxX;
          ctx.moveTo(currX, boxY);
          while(currX < boxX + boxW){
            ctx.quadraticCurveTo(currX + waveW/2, boxY - waveW/2, currX + waveW, boxY);
            currX += waveW;
          }
          ctx.lineTo(boxX + boxW, boxY + boxH);
          currX = boxX + boxW;
          while(currX > boxX){
            ctx.quadraticCurveTo(currX - waveW/2, boxY + boxH + waveW/2, currX - waveW, boxY + boxH);
            currX -= waveW;
          }
          ctx.closePath();
          ctx.fill();
          ctx.strokeStyle = '#4DD0E1'; ctx.lineWidth = borderW; ctx.stroke();
          break;
        case 'sum1':
          let oceanGrad = ctx.createLinearGradient(boxX, boxY, boxX, boxY+boxH);
          oceanGrad.addColorStop(0, '#E0F2FE');
          oceanGrad.addColorStop(0.5, '#BAE6FD');
          oceanGrad.addColorStop(1, '#7DD3FC');
          ctx.fillStyle = oceanGrad;
          ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*2); ctx.fill();
          ctx.strokeStyle = '#22D3EE'; ctx.lineWidth = borderW; ctx.stroke();
          break;
        case 'pea1':
          ctx.fillStyle = '#FFECEC'; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*3); ctx.fill();
          drawPixelPeach(boxX, boxY, boxW, boxH, scale);
          ctx.strokeStyle = '#FDA4AF'; ctx.lineWidth = borderW; ctx.stroke();
          break;
        case 'school1':
          ctx.fillStyle = '#EFF6FF'; ctx.fillRect(boxX,boxY,boxW,boxH);
          drawLinePattern(boxX,boxY,boxW,boxH,scale);
          ctx.strokeStyle = '#60A5FA'; ctx.lineWidth = borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
          break;
        case 'castle1':
          ctx.fillStyle = '#1E293B'; ctx.fillRect(boxX,boxY,boxW,boxH);
          drawGlowStroke(boxX,boxY,boxW,boxH,'#CBD5E1',borderW);
          break;
        default:
          ctx.fillStyle = stylePreviewMap[style].bg;
          ctx.fillRect(boxX, boxY, boxW, boxH);
          ctx.strokeStyle = stylePreviewMap[style].border;
          ctx.lineWidth = borderW;
          ctx.strokeRect(boxX, boxY, boxW, boxH);
      }
      ctx.globalAlpha = 1;
      ctx.fillStyle = textColor;

      // 核心最终方案：绝对居中计算
      const textStartX = boxX + padding;
      // 计算文本整体垂直居中起始Y坐标
      const textStartY = boxY + (boxH - totalTextHeight) / 2;

      // 逐行绘制，水平靠左
      lines.forEach((line, idx) => {
        let charX = textStartX;
        const lineY = textStartY + idx * lineHeight;
        for (let c = 0; c < line.length; c++) {
          ctx.fillText(line[c], charX, lineY);
          charX += ctx.measureText(line[c]).width + letterSpacing;
        }
      });
      ctx.restore();
    }

    function updateOpacityPreview() {
      const op = document.getElementById('opacityPreview');
      const c = stylePreviewMap[currentStyle];
      op.style.backgroundColor = c.bg;
      op.style.borderColor = c.border;
      op.style.opacity = document.getElementById('boxOpacity').value;
    }
    function updateTextColorByStyle() {
      const c = stylePreviewMap[currentStyle];
      document.getElementById('textColor').value = c.isDark ? '#ffffff' : '#000000';
      redrawCanvas();
    }
    function updateTextSizeDisplay() {
      document.getElementById('textSizeVal').textContent = `${Math.round(textSizeScale * 100)}%`;
    }
    function bindAllEvents() {
      document.getElementById('imageUpload').addEventListener('change', e=>{
        const file = e.target.files[0];
        if(!file) return;
        const reader = new FileReader();
        reader.onload = ev=>{
          const img = new Image();
          img.onload = ()=>{
            backgroundImage = img;
            boxOffsetX = boxOffsetY = 0;
            setupCanvas();
          };
          img.src = ev.target.result;
        };
        reader.readAsDataURL(file);
      });
      ['textColor','boxOpacity','bottomMarginSlider','textSizeSlider'].forEach(id=>{
        document.getElementById(id).addEventListener('input', ()=>{
          if(id==='textSizeSlider'){
            textSizeScale = parseFloat(document.getElementById(id).value)/100;
            updateTextSizeDisplay();
          }
          redrawCanvas();
          if(id==='boxOpacity') updateOpacityPreview();
        });
      });
      document.getElementById('dialogueText').addEventListener('input', redrawCanvas);
      document.getElementById('moveUp').onclick = ()=>{boxOffsetY++; redrawCanvas();};
      document.getElementById('moveDown').onclick = ()=>{boxOffsetY--; redrawCanvas();};
      document.getElementById('moveLeft').onclick = ()=>{boxOffsetX--; redrawCanvas();};
      document.getElementById('moveRight').onclick = ()=>{boxOffsetX++; redrawCanvas();};
      document.getElementById('downloadBtn').onclick = ()=>{
        const a = document.createElement('a');
        a.download = '對話框_'+Date.now()+'.png';
        canvas.toBlob(b=>{
          a.href = URL.createObjectURL(b);
          a.click();
          URL.revokeObjectURL(a.href);
        });
      };
    }
  </script>
</body>
</html>
