<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
  <title>對話框生成器</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/font-awesome/4.7.0/css/font-awesome.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      theme: { extend: { colors: { primary: '#A89078', secondary: '#F5F1ED', neutral: '#5C5C5C' }, fontFamily: { sans: ['"Noto Sans SC"', 'system-ui', 'sans-serif'] } } }
    }
  </script>
  <style type="text/tailwindcss">
    @layer utilities {
      .pixel-border { image-rendering: pixelated; image-rendering: crisp-edges; }
      .btn-primary { @apply px-8 py-2.5 rounded-full border border-primary text-primary bg-white hover:bg-primary/5 transition-all duration-300 disabled:border-gray-300 disabled:text-gray-300 disabled:bg-gray-50 disabled:cursor-not-allowed; }
      .btn-mode { @apply px-4 py-2 rounded-full border border-primary bg-white text-primary cursor-pointer transition-all hover:bg-primary hover:text-white; }
      .btn-mode.active { @apply bg-primary text-white; }
      .control-label { @apply text-sm text-neutral/80 font-medium mb-1; }
      .opacity-preview { @apply w-8 h-8 rounded-sm ml-2 flex items-center justify-center; image-rendering: pixelated; border-width: 2px; }
      .style-card { @apply border-2 rounded-md p-2 text-center cursor-pointer transition-all bg-white text-xs; }
      .style-card.active { @apply border-primary bg-primary/10; }
      .style-group-title { @apply text-xs font-semibold text-neutral/70 mt-3 mb-2 border-l-4 border-primary pl-2; }
      .no-resize { resize: none; }
      textarea::-webkit-scrollbar { display: none; }
      textarea { scrollbar-width: none; }
      #previewCanvas { cursor: grab; }
      #previewCanvas:active { cursor: grabbing; }
    }
  </style>
</head>
<body class="bg-secondary min-h-screen flex flex-col overflow-x-hidden font-sans">
  <main class="flex-1 flex flex-col p-4 md:p-6 max-w-5xl mx-auto w-full">
    <!-- 預覽區 -->
    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm mb-4 overflow-hidden flex justify-center relative">
      <div id="emptyPreviewHint" class="text-center py-12 text-neutral/60">
        <i class="fa fa-image text-4xl mb-3 text-neutral/30"></i><br>點擊上傳背景圖片
      </div>
      <div id="previewContainer" class="hidden max-w-full">
        <canvas id="previewCanvas" class="pixel-border rounded"></canvas>
      </div>
    </div>

    <div class="w-full flex justify-center gap-3 mb-4">
      <button id="downloadBtn" class="btn-primary font-medium" disabled>下載圖片</button>
      <!-- 新增：限動模式按鈕 -->
      <button id="storyModeBtn" class="btn-mode font-medium">限動模式 (9:16)</button>
    </div>

    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm mb-4">
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="control-label block">對話文字</label>
          <textarea id="dialogueText" rows="2" class="w-full p-2 border border-gray-200 rounded-md no-resize" placeholder="輸入對話內容...">風吹過街巷 溫柔藏日常 美好一直在身旁</textarea>
        </div>
        <div>
          <label class="control-label block">上傳背景圖</label>
          <input type="file" id="imageUpload" accept="image/*" class="w-full p-2 border border-gray-200 rounded-md">
        </div>
      </div>
    </div>

    <div class="w-full bg-white rounded-lg p-4 md:p-6 shadow-sm">
      <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
        <div class="md:col-span-2 lg:col-span-3">
          <div class="style-group-title">經典</div><div data-group="classic" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3"></div>
          <div class="style-group-title">特調</div><div data-group="new" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3"></div>
          <div class="style-group-title">透明</div><div data-group="transparent" class="grid grid-cols-3 sm:grid-cols-5 gap-2 mb-3"></div>
          <div class="style-group-title">賽博</div><div data-group="cyber" class="grid grid-cols-3 sm:grid-cols-5 gap-2"></div>
        </div>
        <div><label class="control-label block">文字顏色</label><input type="color" id="textColor" value="#000000" class="w-full h-10 border-0 rounded-md cursor-pointer"></div>
        <div>
          <label class="control-label block">對話框透明度</label>
          <div class="flex items-center gap-2">
            <input type="range" id="boxOpacity" min="0.1" max="1" step="0.1" value="1" class="w-full accent-primary">
            <span id="boxOpacityVal" class="text-xs text-neutral/60 w-10">100%</span>
            <div id="opacityPreview" class="opacity-preview"></div>
          </div>
        </div>
        <div>
          <label class="control-label block">文字大小 (%)</label>
          <div class="flex items-center gap-2">
            <input type="range" id="textSizeSlider" min="50" max="150" step="10" value="90" class="w-full accent-primary">
            <span id="textSizeVal" class="text-xs text-neutral/60 w-12">90%</span>
          </div>
        </div>
        <div>
          <label class="control-label block">底部留白距離 (%)</label>
          <input type="range" id="bottomMarginSlider" min="0" max="15" step="0.5" value="8" class="w-full accent-primary">
          <span id="bottomMarginVal" class="text-xs text-neutral/60">8%</span>
        </div>
        <div>
          <label class="control-label block">位置微調</label>
          <div class="flex gap-1">
            <button id="moveUp" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-up"></i></button>
            <button id="moveDown" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-down"></i></button>
            <button id="moveLeft" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-left"></i></button>
            <button id="moveRight" class="flex-1 p-2 border border-gray-200 rounded-md hover:bg-gray-50"><i class="fa fa-arrow-right"></i></button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer class="py-3 px-6 text-center text-sm text-neutral/50 border-t border-gray-100 mt-6">
    對話框生成器 © 2026
  </footer>

  <script>
    const canvas = document.getElementById('previewCanvas');
    const ctx = canvas.getContext('2d');
    let backgroundImage = null;
    let boxOffsetX = 0, boxOffsetY = 0;
    let currentStyle = 'game1';
    let textSizeScale = 0.9;
    // 限動模式變量
    let isStoryMode = false;
    let cropOffsetX = 0, cropOffsetY = 0;
    let isDragging = false, startX = 0, startY = 0;

    const baseFontSize = 24;
    const baseTextPadding = 40;
    const baseLineHeight = 1.8;
    const baseLetterSpacing = 4;
    const baseMinBoxHeight = 120;
    const baseBorderWidth = 6;
    const MIN_FONT_SIZE = 16;
    const MIN_BOX_PADDING = 30;
    const BOX_WIDTH_RATIO = 0.9;
    const STORY_ASPECT_RATIO = 9/16;
    const STORY_BOTTOM_SAFE_AREA = 0.25;

    const styleGroups = {
      classic: [{key:'game1',name:'黑白'},{key:'style1',name:'純紫'},{key:'style2',name:'藍'},{key:'style3',name:'紫'},{key:'style12',name:'粉'},{key:'style14',name:'白雲天空'},{key:'style15',name:'純粉'},{key:'mora1',name:'莫蘭迪咖'},{key:'mora2',name:'莫蘭迪灰'},{key:'maca1',name:'淺粉'},{key:'maca2',name:'薄荷'}],
      cyber: [{key:'castle1',name:'白電光'}],
      new: [{key:'new1',name:'三層白'},{key:'new3',name:'浪漫'},{key:'new7',name:'信紙咖'},{key:'new8',name:'甜蜜'},{key:'new11',name:'漫畫尖角'},{key:'new12',name:'藍波雲'},{key:'sum1',name:'夏日清涼'},{key:'pea1',name:'水蜜桃'},{key:'school1',name:'信紙藍'}],
      transparent: [{key:'ani1',name:'白透'},{key:'ani2',name:'磨砂'}]
    };

    const stylePreviewMap = {
      style1:{bg:'#FFDFFF',border:'#A855F7',isDark:false}, style2:{bg:'#FFF',border:'#0EA5E9',isDark:false},
      style3:{bg:'#FFF',border:'#9333EA',isDark:false}, style12:{bg:'#FFF',border:'#FF69B4',isDark:false},
      style14:{bg:'#87CEFA',border:'#FFF',isDark:false}, style15:{bg:'#FFB6C1',border:'#FF1493',isDark:false},
      game1:{bg:'#111',border:'#EEE',isDark:true}, maca1:{bg:'#FFEEF4',border:'#F8BBD0',isDark:false},
      maca2:{bg:'#E8F8F5',border:'#80CBC4',isDark:false}, mora1:{bg:'#EAE2E2',border:'#BFA8A8',isDark:false},
      mora2:{bg:'#E2E8F0',border:'#94A3B8',isDark:false}, ani1:{bg:'rgba(255,255,255,0.88)',border:'#D1D5DB',isDark:false},
      ani2:{bg:'rgba(255,255,250,0.92)',border:'rgba(200,200,200,0.7)',isDark:false}, new1:{bg:'#121212',border:'#E5E5E5',isDark:true},
      new3:{bg:'#FFEEF6',border:'#FFB7C5',isDark:false}, new7:{bg:'#F5EFE2',border:'#A89078',isDark:false},
      new8:{bg:'#FFEEF2',border:'#F472B6',isDark:false}, new11:{bg:'#FFF',border:'#64748B',isDark:false},
      new12:{bg:'#E0F7FA',border:'#4DD0E1',isDark:false}, sum1:{bg:'#E6FFFA',border:'#22D3EE',isDark:false},
      pea1:{bg:'#FFECEC',border:'#FDA4AF',isDark:false}, school1:{bg:'#EFF6FF',border:'#60A5FA',isDark:false},
      castle1:{bg:'#1E293B',border:'#CBD5E1',isDark:true}
    };

    window.addEventListener('load', () => {
      ctx.imageSmoothingEnabled = false;
      loadDefaultBackground();
      buildStyles();
      bindEvents();
      bindStoryMode();
      bindDragEvents();
      updateOpacityPreview();
      updateTextColorByStyle();
      updateTextSizeDisplay();
      
      const opacityVal = document.getElementById('boxOpacity').value;
      document.getElementById('boxOpacityVal').textContent = `${Math.round(opacityVal * 100)}%`;
      document.getElementById('bottomMarginVal').textContent = document.getElementById('bottomMarginSlider').value + '%';
      highlightStyle();
    });

    // 綁定限動模式
    function bindStoryMode() {
      const btn = document.getElementById('storyModeBtn');
      btn.addEventListener('click', () => {
        isStoryMode = !isStoryMode;
        btn.classList.toggle('active');
        cropOffsetX = 0;
        cropOffsetY = 0;
        setupCanvas();
      });
    }

    // 拖動調整裁切範圍
    function bindDragEvents() {
      canvas.addEventListener('mousedown', (e) => {
        if(!isStoryMode || !backgroundImage) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
      });

      window.addEventListener('mousemove', (e) => {
        if(!isDragging || !isStoryMode) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        cropOffsetX += dx;
        cropOffsetY += dy;
        startX = e.clientX;
        startY = e.clientY;
        redraw();
      });

      window.addEventListener('mouseup', () => isDragging = false);
      canvas.addEventListener('mouseleave', () => isDragging = false);
    }

    function buildStyles() {
      Object.keys(styleGroups).forEach(g => {
        const wrap = document.querySelector(`[data-group="${g}"]`);
        styleGroups[g].forEach(item => {
          const c = document.createElement('div');
          c.className = 'style-card';
          c.dataset.style = item.key;
          c.innerText = item.name;
          c.onclick = () => { currentStyle = item.key; highlightStyle(); updateOpacityPreview(); updateTextColorByStyle(); redraw(); };
          wrap.appendChild(c);
        });
      });
    }

    function highlightStyle() {
      document.querySelectorAll('.style-card').forEach(c => c.classList.toggle('active', c.dataset.style === currentStyle));
    }

    function loadDefaultBackground() {
      const img = new Image();
      img.crossOrigin = 'anonymous';
      img.src = 'https://picsum.photos/1000/600?color=1';
      img.onload = () => { backgroundImage = img; setupCanvas(); };
    }

    function setupCanvas() {
      if(!backgroundImage) return;
      const dpr = window.devicePixelRatio || 1;
      const maxW = Math.min(backgroundImage.width, window.innerWidth - 32);
      let displayW, displayH;

      if(isStoryMode) {
        displayH = maxW / STORY_ASPECT_RATIO;
        displayW = maxW;
      } else {
        const scale = maxW / backgroundImage.width;
        displayW = maxW;
        displayH = backgroundImage.height * scale;
      }

      canvas.width = displayW * dpr;
      canvas.height = displayH * dpr;
      canvas.style.width = displayW + 'px';
      canvas.style.height = displayH + 'px';
      ctx.setTransform(1,0,0,1,0,0);
      ctx.scale(dpr, dpr);
      redraw();
      
      document.getElementById('emptyPreviewHint').classList.add('hidden');
      document.getElementById('previewContainer').classList.remove('hidden');
      document.getElementById('downloadBtn').disabled = false;
    }

    function redraw() {
      if (!backgroundImage) return;
      const dpr = window.devicePixelRatio || 1;
      ctx.clearRect(0,0,canvas.width/dpr,canvas.height/dpr);

      // 繪製背景（支援9:16裁切+拖動）
      if(isStoryMode) {
        const canvasW = canvas.width/dpr;
        const canvasH = canvas.height/dpr;
        const imgRatio = backgroundImage.width / backgroundImage.height;
        let drawW, drawH, offsetX = 0, offsetY = 0;

        if(imgRatio > STORY_ASPECT_RATIO) {
          drawH = canvasH;
          drawW = backgroundImage.width * (drawH / backgroundImage.height);
          offsetX = cropOffsetX;
        } else {
          drawW = canvasW;
          drawH = backgroundImage.height * (drawW / backgroundImage.width);
          offsetY = cropOffsetY;
        }

        ctx.drawImage(backgroundImage, offsetX, offsetY, drawW, drawH);
      } else {
        ctx.drawImage(backgroundImage,0,0,canvas.width/dpr,canvas.height/dpr);
      }

      const w = canvas.width/dpr, h=canvas.height/dpr;
      const s = w/1000;
      const fs = Math.max(MIN_FONT_SIZE, baseFontSize*s*textSizeScale);
      const pad = Math.max(MIN_BOX_PADDING, baseTextPadding*s);
      const lh = baseLineHeight*fs;
      const ls = baseLetterSpacing*s;
      const minh = Math.max(baseMinBoxHeight*s, fs*1.5);
      const bw = Math.max(2, Math.round(baseBorderWidth*s));
      const ox = (boxOffsetX/100)*w, oy=(boxOffsetY/100)*h;
      
      drawBox(w,h,s,fs,pad,lh,ls,minh,bw,ox,oy);
    }

    function drawBox(imgW,imgH,scale,fontSize,padding,lineHeight,letterSpacing,minH,borderW,offsetX,offsetY){
      const text = document.getElementById('dialogueText').value.trim();
      const color = document.getElementById('textColor').value;
      const opacity = +document.getElementById('boxOpacity').value;
      const marginPerc = +document.getElementById('bottomMarginSlider').value;
      let marginBottom = (marginPerc/100)*imgH;

      // 限動模式：自動避開IG底部安全區
      if(isStoryMode) {
        marginBottom = imgH * STORY_BOTTOM_SAFE_AREA;
      }

      ctx.font = `${fontSize}px 'Noto Sans SC', sans-serif`;
      ctx.textBaseline = 'top';
      const boxW = imgW*BOX_WIDTH_RATIO;
      const maxTextW = boxW - padding*2;
      const lines = [];
      let currLine = '', currW=0;
      [...text].forEach(c => {
        const cw = ctx.measureText(c).width;
        const add = currW===0 ? cw : cw+letterSpacing;
        if (currW + add <= maxTextW) { currLine+=c; currW+=add; }
        else { lines.push(currLine); currLine=c; currW=cw; }
      });
      if (currLine) lines.push(currLine);
      
      const totalH = lines.length * lineHeight;
      const boxH = Math.max(minH, totalH + padding*2);
      const boxX = (imgW-boxW)/2 + offsetX;
      let boxY = imgH - boxH - marginBottom - offsetY;
      if (boxY<20) boxY=20;

      ctx.save();
      ctx.globalAlpha = opacity;
      const s = currentStyle;
      if(s==='style14'){
        const g=ctx.createLinearGradient(boxX,boxY,boxX,boxY+boxH);
        g.addColorStop(0,'#87CEFA');g.addColorStop(1,'#E0F7FF');
        ctx.fillStyle=g; const r=borderW*3;
        ctx.beginPath(); ctx.moveTo(boxX+r,boxY); ctx.lineTo(boxX+boxW-r,boxY); ctx.quadraticCurveTo(boxX+boxW,boxY,boxX+boxW,boxY+r);
        ctx.lineTo(boxX+boxW,boxY+boxH-r); ctx.quadraticCurveTo(boxX+boxW,boxY+boxH,boxX+boxW-r,boxY+boxH);
        ctx.lineTo(boxX+r,boxY+boxH); ctx.quadraticCurveTo(boxX,boxY+boxH,boxX,boxY+boxH-r);
        ctx.lineTo(boxX,boxY+r); ctx.quadraticCurveTo(boxX,boxY,boxX+r,boxY); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#fff'; ctx.lineWidth=borderW*1.2; ctx.stroke();
      } else if(s==='ani2'){
        ctx.fillStyle=stylePreviewMap[s].bg; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*4); ctx.fill();
        ctx.strokeStyle=stylePreviewMap[s].border; ctx.lineWidth=borderW; ctx.stroke();
      } else if(s==='new1'){
        ctx.fillStyle='#121212'; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle='#E5E5E5'; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle='#BBB'; ctx.lineWidth=borderW*0.5; ctx.strokeRect(boxX+bw,boxY+bw,boxW-bw*2,boxH-bw*2);
        ctx.strokeStyle='#888'; ctx.lineWidth=borderW*0.25; ctx.strokeRect(boxX+bw*2,boxY+bw*2,boxW-bw*4,boxH-bw*4);
      } else if(s==='new3'){
        ctx.fillStyle='#FFEEF6'; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*2); ctx.fill();
        ctx.strokeStyle='#FFC8D8'; ctx.lineWidth=borderW; ctx.stroke();
        ctx.strokeStyle='#FFB7C5'; ctx.lineWidth=borderW*0.5; ctx.strokeRect(boxX+bw,boxY+bw,boxW-bw*2,boxH-bw*2);
      } else if(s==='new7'){
        ctx.fillStyle='#F5EFE2'; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle='#A89078'; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
      } else if(s==='new8'){
        ctx.fillStyle='#FFEEF2'; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle='#F472B6'; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
      } else if(s==='new11'){
        ctx.fillStyle='#fff'; ctx.beginPath();
        ctx.moveTo(boxX+bw*3,boxY); ctx.lineTo(boxX+boxW-bw*3,boxY); ctx.lineTo(boxX+boxW,boxY+boxH/2);
        ctx.lineTo(boxX+boxW-bw*3,boxY+boxH); ctx.lineTo(boxX+bw*3,boxY+boxH); ctx.closePath(); ctx.fill();
        ctx.strokeStyle='#64748B'; ctx.lineWidth=borderW; ctx.stroke();
      } else if(s==='new12'){
        ctx.fillStyle='#E0F7FA'; ctx.beginPath(); const ww=borderW*2.5; let cx=boxX;
        ctx.moveTo(cx,boxY); while(cx<boxX+boxW){ctx.quadraticCurveTo(cx+ww/2,boxY-ww/2,cx+ww,boxY);cx+=ww;}
        ctx.lineTo(boxX+boxW,boxY+boxH); cx=boxX+boxW;
        while(cx>boxX){ctx.quadraticCurveTo(cx-ww/2,boxY+boxH+ww/2,cx-ww,boxY+boxH);cx-=ww;}
        ctx.closePath(); ctx.fill(); ctx.strokeStyle='#4DD0E1'; ctx.lineWidth=borderW; ctx.stroke();
      } else if(s==='sum1'){
        const g=ctx.createLinearGradient(boxX,boxY,boxX,boxY+boxH);
        g.addColorStop(0,'#E0F2FE');g.addColorStop(0.5,'#BAE6FD');g.addColorStop(1,'#7DD3FC');
        ctx.fillStyle=g; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*2); ctx.fill();
        ctx.strokeStyle='#22D3EE'; ctx.lineWidth=borderW; ctx.stroke();
      } else if(s==='pea1'){
        ctx.fillStyle='#FFECEC'; ctx.beginPath(); ctx.roundRect(boxX,boxY,boxW,boxH,borderW*3); ctx.fill();
        ctx.strokeStyle='#FDA4AF'; ctx.lineWidth=borderW; ctx.stroke();
      } else if(s==='school1'){
        ctx.fillStyle='#EFF6FF'; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle='#60A5FA'; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
      } else if(s==='castle1'){
        ctx.fillStyle='#1E293B'; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.shadowColor='#CBD5E1'; ctx.shadowBlur=borderW*2.5;
        ctx.strokeStyle='#CBD5E1'; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
        ctx.shadowBlur=0;
      } else {
        ctx.fillStyle=stylePreviewMap[s].bg; ctx.fillRect(boxX,boxY,boxW,boxH);
        ctx.strokeStyle=stylePreviewMap[s].border; ctx.lineWidth=borderW; ctx.strokeRect(boxX,boxY,boxW,boxH);
      }

      ctx.globalAlpha = 1;
      ctx.fillStyle = color;
      const tx = boxX + padding;
      const ty = boxY + (boxH - totalH) / 2;

      lines.forEach((line, i) => {
        let x = tx;
        const y = ty + i * lineHeight;
        [...line].forEach(c => {
          ctx.fillText(c, x, y);
          x += ctx.measureText(c).width + letterSpacing;
        });
      });

      ctx.restore();
    }

    function updateOpacityPreview() {
      const o = document.getElementById('opacityPreview');
      const c = stylePreviewMap[currentStyle];
      o.style.backgroundColor = c.bg;
      o.style.borderColor = c.border;
      o.style.opacity = document.getElementById('boxOpacity').value;
    }

    function updateTextColorByStyle() {
      const c = stylePreviewMap[currentStyle];
      document.getElementById('textColor').value = c.isDark ? '#fff' : '#000';
      redraw();
    }

    function updateTextSizeDisplay() {
      document.getElementById('textSizeVal').textContent = Math.round(textSizeScale*100)+'%';
    }

    function bindEvents() {
      document.getElementById('imageUpload').onchange = e => {
        const f = e.target.files[0];
        if(!f) return;
        const r = new FileReader();
        r.onload = ev => {
          const img = new Image();
          img.onload = () => { backgroundImage=img; boxOffsetX=boxOffsetY=0; cropOffsetX=0; cropOffsetY=0; setupCanvas(); };
          img.src = ev.target.result;
        };
        r.readAsDataURL(f);
      };

      ['textColor','boxOpacity','bottomMarginSlider','textSizeSlider'].forEach(id => {
        document.getElementById(id).oninput = () => {
          const val = document.getElementById(id).value;
          if(id==='textSizeSlider'){ textSizeScale=+val/100; updateTextSizeDisplay(); }
          if(id==='boxOpacity'){ document.getElementById('boxOpacityVal').textContent = `${Math.round(val * 100)}%`; }
          if(id==='bottomMarginSlider'){ document.getElementById('bottomMarginVal').textContent=val+'%'; }
          redraw();
          if(id==='boxOpacity') updateOpacityPreview();
        };
      });

      document.getElementById('dialogueText').oninput = redraw;
      document.getElementById('moveUp').onclick = ()=>{boxOffsetY++; redraw();};
      document.getElementById('moveDown').onclick = ()=>{boxOffsetY--; redraw();};
      document.getElementById('moveLeft').onclick = ()=>{boxOffsetX--; redraw();};
      document.getElementById('moveRight').onclick = ()=>{boxOffsetX++; redraw();};
      
      document.getElementById('downloadBtn').onclick = ()=>{
        const a = document.createElement('a');
        a.download = `對話框_${isStoryMode?'限動模式':'一般'}_${Date.now()}.png`;
        canvas.toBlob(b=>{ a.href=URL.createObjectURL(b); a.click(); URL.revokeObjectURL(a.href); });
      };
    }
  </script>
</body>
</html>
