<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>標示牌產生器</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,Microsoft JhengHei,sans-serif}
        body{background:#f5f6f8;padding:20px;display:flex;flex-direction:column;align-items:center}
        .preview{background:#fff;padding:20px;border-radius:14px;margin:20px 0;text-align:center}
        .control{background:#fff;padding:20px;border-radius:14px;width:100%;max-width:400px}
        input{width:100%;padding:10px;margin:8px 0;border:1px solid #ddd;border-radius:8px}
        button{padding:12px;width:100%;background:#e53935;color:#fff;border:none;border-radius:8px;margin-top:6px;cursor:pointer}
        .preset{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
        .preset button{width:auto;padding:6px 12px;background:#eee;color:#000}
        canvas{display:block;margin:0 auto}
    </style>
</head>
<body>

<h2>標示牌產生器</h2>
<div class="preview">
    <h3>預覽</h3>
    <canvas id="c"></canvas>
</div>

<div class="control">
    <input id="text" value="冷氣開放中">
    <div class="preset">
        <button onclick="set('營業中')">營業中</button>
        <button onclick="set('休息中')">休息中</button>
        <button onclick="set('冷氣開放中')">冷氣開放中</button>
    </div>
    <button onclick="draw()">更新預覽</button>
    <button onclick="download()" style="background:#333">下載透明圖</button>
</div>

<script>
const ctx = c.getContext('2d');

// 固定尺寸 → 永遠不變形
const W = 180;
const H = 500;
const FONT = 70;
const GAP = 84;

function set(t) {
    document.getElementById('text').value = t;
    draw();
}

function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y);
    ctx.lineTo(x+w-r,y);
    ctx.quadraticCurveTo(x+w,y,x+w,y+r);
    ctx.lineTo(x+w,y+h-r);
    ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
    ctx.lineTo(x+r,y+h);
    ctx.quadraticCurveTo(x,y+h,x,y+h-r);
    ctx.lineTo(x,y+r);
    ctx.quadraticCurveTo(x,y,x+r,y);
    ctx.closePath();
}

function draw() {
    c.width = W;
    c.height = H;
    ctx.clearRect(0,0,W,H);

    // 外框
    roundRect(6,6,W-12,H-12,10);
    ctx.fillStyle = "#fff";
    ctx.fill();
    ctx.strokeStyle = "#e53935";
    ctx.lineWidth = 6;
    ctx.stroke();

    const txt = document.getElementById('text').value;
    const chars = txt.split('');
    
    ctx.fillStyle = "#e53935";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.font = `bold ${FONT}px sans-serif`;

    // 🔥 唯一正確：整組文字「強制置中」，沒有複雜計算
    const total = (chars.length - 1) * GAP;
    const y = H / 2 - total / 2;

    chars.forEach((ch, i) => {
        ctx.fillText(ch, W/2, y + i * GAP);
    });
}

function download(){
    const a = document.createElement('a');
    a.download = "sign.png";
    a.href = c.toDataURL('image/png');
    a.click();
}

draw();
</script>
</body>
</html>
